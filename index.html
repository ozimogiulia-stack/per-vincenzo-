<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domanda per Vincenzo...</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e0f2fe; /* Un bell'azzurro mare chiaro */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            max-width: 450px;
            width: 90%;
        }

        h1 {
            color: #0284c7; /* Blu oceano */
            font-size: 26px;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            height: 50px;
        }

        button {
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        #btn-yes {
            background-color: #0ea5e9;
            color: white;
        }

        #btn-yes:hover {
            transform: scale(1.1);
            background-color: #0369a1;
        }

        #btn-no {
            background-color: #ef4444;
            color: white;
            position: absolute;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- La tua domanda personalizzata -->
        <h1 id="question">Vincenzo vuoi venire a mare con me domani ?🤍</h1>
        
        <div class="buttons">
            <button id="btn-yes" onclick="celebrate()">SÌ</button>
            <button id="btn-no" onmouseover="flee()" onclick="flee()">NO</button>
        </div>
    </div>

    <script>
        // Funzione per far scappare il pulsante NO
        function flee() {
            const btnNo = document.getElementById('btn-no');
            
            // Calcola posizioni casuali all'interno dello schermo
            const x = Math.random() * (window.innerWidth - btnNo.offsetWidth - 20);
            const y = Math.random() * (window.innerHeight - btnNo.offsetHeight - 20);
            
            // Applica le nuove coordinate
            btnNo.style.position = 'fixed';
            btnNo.style.left = x + 'px';
            btnNo.style.top = y + 'px';
        }

        // Funzione per quando Vincenzo clicca SÌ
        function celebrate() {
            const card = document.querySelector('.card');
            // Messaggio finale a tema spiaggia
            card.innerHTML = `
                <h1 style="font-size: 30px; color: #0284c7;">Sììì! Prepara il costume! 🌊☀️🏖️</h1>
                <p style="font-size: 18px; color: #334155;">Non vedo l'ora! 🥰</p>
            `;
        }
    </script>

</body>
</html>
